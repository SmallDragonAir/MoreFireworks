# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
org.gradle.caching=true
# Configuration cache is disabled on purpose: the build environment used for this project has
# spotty network access and several tasks are network bound.
org.gradle.configuration-cache=false

# Environment Properties
# You can find the latest versions here: https://projects.neoforged.net/neoforged/neoforge
# This branch targets Minecraft 1.21.1 with NeoForge 21.1.x. The baseline for development is
# 21.1.244; any 21.1.x >= that is API compatible for everything this mod uses, so server owners
# can run whatever 21.1.x build they already have.
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.22)
neo_version=21.1.244
# Declared compatibility range: the mod only uses stable 21.1 API, so every 21.1.x server is fine.
neo_version_range=[21.1.0,)
# Minecraft 1.21.1 runs on Java 21, so mods must target Java 21.
java_version=21

## Mod Properties
mod_id=morefireworks
mod_name=More Fireworks
mod_license=MIT
# The +mc1.21.1 suffix keeps this jar from ever colliding with the 26.2 build.
mod_version=1.0.0+mc1.21.1
mod_group_id=com.morefireworks
mod_authors=More Fireworks Team
mod_description=A firework system with astronomically many parameter combinations.
